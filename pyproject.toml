[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifevault"
version = "2.0.0"
authors = [
  { name="Kartabya Krishna" }
]
description = "Sovereign Personal Data Lakehouse, Omnichannel Telemetry Engine & Cryptographic Archivist"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Archiving :: Backup"
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "imagehash>=4.3.0",
    "pillow>=10.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
whatsapp = [
    "wa-crypt-tools>=0.1.0"
]

[project.scripts]
lifevault = "lifevault.cli:main"
